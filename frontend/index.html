<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/myquote-app-icon-dark.svg" />
    <link rel="apple-touch-icon" href="/brand/myquote-app-icon-dark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyQuote</title>
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
