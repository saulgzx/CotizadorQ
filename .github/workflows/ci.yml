name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - stage*

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        env:
          JWT_SECRET: ci-jwt-secret-with-minimum-32-characters
          ALLOWED_ORIGINS: http://localhost:5173
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit --omit=dev --audit-level=high

  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Igual que el Dockerfile; node --test con glob requiere >= 21.
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit --omit=dev --audit-level=high

  agente-ia:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agente-ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        run: npm test
      - name: Audit
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # xlsx 0.18.5 tiene alertas altas sin parche en npm; quitar al migrar a SheetJS 0.20.x.
      - name: Audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
